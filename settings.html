<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>kakao clone_setting</title>
</head>
<body>
    <div class="phone">
    <div class="statusbar">
        <div class="statusbar__left">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <span class="statusbar__time">18:43</span>
        <div class="statusbar__right">
            <i class="fa-solid fa-lock"></i>
            <span>11%</span>
            <i class="fa-solid fa-battery-quarter"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>

    <div class="settings-header">
        <i class="fa-solid fa-chevron-left"></i>
        <h1 class="settings-header__title">Settings</h1>
        <i class="fa-solid fa-magnifying-glass"></i>
    </div>

    <div class="settings-group">
        <div class="settings-item">
            <i class="fa-solid fa-bullhorn"></i>
            <span class="settings-item__name">Notices</span>
        </div>
        <div class="settings-item">
            <i class="fa-solid fa-flask"></i>
            <span class="settings-item__name">Kakao Lab</span>
        </div>
        <div class="settings-item">
            <i class="fa-solid fa-circle-info"></i>
            <span class="settings-item__name">Version</span>
            <span class="settings-item__value">Latest Version</span>
        </div>
    </div>

    <div class="settings-group">
        <div class="settings-item">
            <i class="fa-solid fa-lock"></i>
            <span class="settings-item__name">Privacy</span>
        </div>
        <div class="settings-item">
            <i class="fa-regular fa-bell"></i>
            <span class="settings-item__name">Notifications</span>
        </div>
        <div class="settings-item">
            <i class="fa-regular fa-user"></i>
            <span class="settings-item__name">Friends</span>
        </div>
        <div class="settings-item">
            <i class="fa-regular fa-comment"></i>
            <span class="settings-item__name">Chats</span>
        </div>
        <div class="settings-item">
            <i class="fa-regular fa-sun"></i>
            <span class="settings-item__name">Display</span>
            <span class="badge badge-chat badge-n">N</span>
        </div>
        <div class="settings-item">
            <i class="fa-solid fa-paintbrush"></i>
            <span class="settings-item__name">Themes</span>
            <span class="badge badge-chat badge-n">N</span>
            <span class="settings-item__value">Default theme</span>
        </div>
        <div class="settings-item">
            <i class="fa-solid fa-phone"></i>
            <span class="settings-item__name">Call</span>
        </div>
    </div>

    <nav class="tabbar">
        <a href="friends.html" class="tabbar__item">
            <i class="fa-regular fa-user"></i>
        </a>
        <a href="chats.html" class="tabbar__item">
            <i class="fa-regular fa-comment"></i>
            <span class="badge">1</span>
        </a>
        <a href="find.html" class="tabbar__item">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
        <a href="more.html" class="tabbar__item active">
            <i class="fa-solid fa-ellipsis"></i>
        </a>
    </nav>    

    <script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>   
</body>
</html>
