<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>kakao clone_chats</title>
</head>
<body>
    <div class="phone">
    <div class="statusbar">
        <div class="statusbar__left">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <span class="statusbar__time">18:43</span>
        <div class="statusbar__right">
            <i class="fa-solid fa-lock"></i>
            <span>11%</span>
            <i class="fa-solid fa-battery-quarter"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>
        <div class="header">
            <h1 class="header__title">Friends</h1>
            <div class="header__icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-music"></i>
                <i class="fa-solid fa-gear"></i>
            </div>
        </div>

        <div class="info">
            <i class="fa-solid fa-circle-info"></i>
            <span>Friends' Names Display</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="user-component">
            <div class="user-component__profile">
                <div class="user-component__profile__image">
                    <img src="img/user.png" alt="user">
                </div>
                <span class="user-component__profile__name">kitty</span>
            </div>
        </div>

        <div class="channel-title">
            <span>Channel</span>
            <i class="fa-solid fa-chevron-up"></i>
        </div>

        <div class="channel-list">
            <div class="channel-list-component">
                <div class="channel-list-component__pofile__image">
                    <img src="img/channel.png">
                </div>
                <span class="channel-list-component__pofile__image__name">Channel</span>
                <span class="channel-list-component__pofile__image__info">2 <i class="fa-solid fa-chevron-right"></i></span>
            </div>
        </div>

        <nav class="tabbar">
            <a href="friends.html" class="tabbar__item active">
                <i class="fa-regular fa-user"></i>
            </a>
            <a href="chats.html" class="tabbar__item">
                <i class="fa-regular fa-comment"></i>
                <span class="badge">1</span>
            </a>
            <a href="find.html" class="tabbar__item">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <a href="more.html" class="tabbar__item">
                <i class="fa-solid fa-ellipsis"></i>
            </a>
        </nav>
    


    </div>
       <script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>   
</body>
</html>
