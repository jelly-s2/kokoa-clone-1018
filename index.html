<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>kakao clone</title>
</head>
<body>
    <div class="phone">
        <div class="statusbar">
            <div class="statusbar__left">
                <span>No Service</span>
                <i class="fa-solid fa-wifi"></i>
            </div>
            <span class="statusbar__time">18:43</span>
            <div class="statusbar__right">
                <i class="fa-solid fa-lock"></i>
                <span>11%</span>
                <i class="fa-solid fa-battery-quarter"></i>
                <i class="fa-solid fa-bolt"></i>
            </div>
        </div>

        <div class="login">
            <h1 class="login__title">Welcome to KakaoTalk</h1>
            <p class="login__desc">
                If you have a Kakao Account,<br>
                log in with your email or phone number.
            </p>

            <form class="login__form">
                <input type="text" placeholder="Email or phone number">
                <input type="password" placeholder="Password">
            </form>

            <div class="login__btns">
                <a href="splash.html" class="login__btn">Log In</a>
                <a href="#" class="login__btn">Sign Up</a>
            </div>

            <a href="#" class="login__find">Find Kakao Account or Password</a>
        </div>


    </div>

    <script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>
</body>
</html>
