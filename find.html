<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>kakao clone_find</title>
</head>
<body>
    <div class="phone">
    <div class="statusbar">
        <div class="statusbar__left">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <span class="statusbar__time">18:43</span>
        <div class="statusbar__right">
            <i class="fa-solid fa-lock"></i>
            <span>11%</span>
            <i class="fa-solid fa-battery-quarter"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>
        <div class="header">
            <h1 class="header__title">Find</h1>
            <div class="header__icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-gear"></i>
            </div>
        </div>
    
    <div class="find-menu">
        <div class="find-menu__item">
            <i class="fa-solid fa-qrcode"></i>
            <span>QR Code</span>
        </div>
        <div class="find-menu__item">
            <i class="fa-regular fa-address-book"></i>
            <span>Add by <br> Contacts</span>
        </div>
        <div class="find-menu__item">
            <i class="fa-regular fa-id-badge"></i>
            <span>Add by ID</span>
        </div>
        <div class="find-menu__item">
            <i class="fa-regular fa-envelope"></i>
            <span>Invite</span>
        </div>
    </div>

    <div class="section-label">
        <span>Recommended Friends</span>
    </div>

    <p class="empty-text">You have no recommended friends.</p>

    <div class="section-label">
        <span>Open Chat</span>
        <span>Go to Openchat Home <i class="fa-solid fa-chevron-right"></i></span>
    </div>

    <div class="open-chat">
        <div class="open-chat__text">
            <span class="open-chat__title">#BTS</span>
            <span class="open-chat__tags">#BTS#ARMY#FRIENDS</span>
            <span class="open-chat__members">802 members | <b>Active</b></span>
        </div>
        <div class="open-chat__image"><img src="img/openchat.png"></div>
    </div>

        <nav class="tabbar">
            <a href="friends.html" class="tabbar__item">
                <i class="fa-regular fa-user"></i>
            </a>
            <a href="chats.html" class="tabbar__item">
                <i class="fa-regular fa-comment"></i>
                <span class="badge">1</span>
            </a>
            <a href="find.html" class="tabbar__item active">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <a href="more.html" class="tabbar__item">
                <i class="fa-solid fa-ellipsis"></i>
            </a>
        </nav>

    
    </div>



    <script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>   
</body>
</html>
