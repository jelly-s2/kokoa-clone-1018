<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>kakao clone_loading</title>
</head>
<body>
    <div class="phone">
    <div class="statusbar">
        <div class="statusbar__left">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <span class="statusbar__time">18:43</span>
        <div class="statusbar__right">
            <i class="fa-solid fa-lock"></i>
            <span>11%</span>
            <i class="fa-solid fa-battery-quarter"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>

    <div class="header">
        <h1 class="header__title">Chats</h1>
        <div class="header__icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-comment"></i>
            <i class="fa-solid fa-music"></i>
            <i class="fa-solid fa-gear"></i>
        </div>
    </div>

    <div class="chat-list">
        <div class="chat-list__component">
            <div class="chat-list__component__image">
                <img src="img/kakao.png" alt="Kakao">
            </div>
            <div class="chat-list__component__text">
                <a href="chatroom.html"> 
                <span class="chat-list__component__text__name">KakaoTalk</span></a>
                <span class="chat-list__component__text__preview">Please check My Kakao Account Info</span>
            </div>
            <div class="chat-list__component__notification">
                <span class="chat-list__component__notification__time">21:22</span>
                <span class="badge badge-chat">1</span>
            </div>
        </div>
    </div>

    <nav class="tabbar">
        <a href="friends.html" class="tabbar__item">
            <i class="fa-regular fa-user"></i>
        </a>
        <a href="chats.html" class="tabbar__item active">
            <i class="fa-solid fa-comment"></i>
            <span class="badge">1</span>
        </a>
        <a href="find.html" class="tabbar__item">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
        <a href="more.html" class="tabbar__item">
            <i class="fa-solid fa-ellipsis"></i>
        </a>
    </nav>

    </div>
    <script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>
</body>
