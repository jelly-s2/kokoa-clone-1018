<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>kakao clone_chatroom</title>
</head>
<body>
    <div class="phone chatroom">
    <div class="statusbar">
        <div class="statusbar__left">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <span class="statusbar__time">18:43</span>
        <div class="statusbar__right">
            <i class="fa-solid fa-lock"></i>
            <span>11%</span>
            <i class="fa-solid fa-battery-quarter"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>

        <div class="chat-header">
            <a href="chats.html"><i class="fa-solid fa-chevron-left"></i></a>
            <h1 class="chat-header__title">kitty</h1>
            <div class="chat-header__icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>

        <div class="chat-date">Monday, October 19, 2026</div>

        <div class="message message--in">
            <div class="message__avatar"><img src="img/user.png"></div>
            <div class="message__body">
                <span class="message__name">kitty</span>
                <div class="message__row">
                    <span class="message__bubble">Hello!</span>
                    <span class="message__time">21:27</span>
                </div>
            </div>
        </div>

        <div class="message message--out">
            <span class="message__time">21:27</span>
            <span class="message__bubble">What's up?</span>
        </div>

        <div class="reply">
            <div class="reply__column">
                <i class="fa-regular fa-square-plus"></i>
            </div>
            <div class="reply__column reply__column--input">
                <input type="text" placeholder="XOXO">
                <i class="fa-regular fa-face-smile-wink"></i>
            </div>
            <button><i class="fa-solid fa-arrow-up"></i></button>
        </div>

        <img class="keyboard" src="img/keyboard.png" alt="keyboard">
    </div>
    <script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>   
</body>
</html>
