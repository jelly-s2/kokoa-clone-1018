<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>kakao clone_more</title>
</head>
<body>
    <div class="phone">
    <div class="statusbar">
        <div class="statusbar__left">
            <span>No Service</span>
            <i class="fa-solid fa-wifi"></i>
        </div>
        <span class="statusbar__time">18:43</span>
        <div class="statusbar__right">
            <i class="fa-solid fa-lock"></i>
            <span>11%</span>
            <i class="fa-solid fa-battery-quarter"></i>
            <i class="fa-solid fa-bolt"></i>
        </div>
    </div>

    <div class="header">
        <h1 class="header__title">More</h1>
        <div class="header__icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-music"></i>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
        </div>
    </div>

    <div class="more-profile">
        <div class="more-profile__image">
            <img src="img/user.png" alt="Nicolas">
        </div>
        <div class="more-profile__text">
            <span class="more-profile__name">kitty</span>
            <span class="more-profile__phone">+1 787-493-4219 <i class="fa-solid fa-circle-exclamation"></i></span>
        </div>
        <i class="fa-regular fa-message more-profile__icon"></i>
    </div>

    <div class="more-menu">
        <div class="more-menu__item">
            <i class="fa-regular fa-calendar-check"></i>
            <span>Calendar</span>
        </div>
        <div class="more-menu__item">
            <i class="fa-regular fa-folder-open"></i>
            <span>Talk Drive</span>
        </div>
        <div class="more-menu__item">
            <i class="fa-regular fa-face-smile"></i>
            <span>Emoticons</span>
        </div>
        <div class="more-menu__item">
            <i class="fa-solid fa-paintbrush"></i>
            <span>Themes</span>
        </div>
        <div class="more-menu__item">
            <i class="fa-solid fa-circle-nodes"></i>
            <span>Account</span>
        </div>
        <div class="more-menu__item">
            <i class="fa-regular fa-comments"></i>
            <span>Openchat</span>
        </div>
    </div>

    <div class="more-suggestions">
        <span class="more-suggestions__title">Suggestions</span>
        <div class="more-suggestions__list">
            <div class="more-suggestions__item">
                <div class="more-suggestions__image"><img src="img/KakaoStory_Logo.png"></div>
                <span>Kakao Story</span>
            </div>

        </div>
    </div>

    <nav class="tabbar">
        <a href="friends.html" class="tabbar__item">
            <i class="fa-regular fa-user"></i>
        </a>
        <a href="chats.html" class="tabbar__item">
            <i class="fa-regular fa-comment"></i>
            <span class="badge">1</span>
        </a>
        <a href="find.html" class="tabbar__item">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
        <a href="more.html" class="tabbar__item active">
            <i class="fa-solid fa-ellipsis"></i>
        </a>
    </nav>

    <script src="https://kit.fontawesome.com/acccf4e870.js" crossorigin="anonymous"></script>   
</body>
</html>
